# ============================================================================
# Nautiq — Deploy Oráculo (LangGraph) to Azure Functions (Flex Consumption)
# ============================================================================
# Despliegue por CÓDIGO (zip + build remoto), no por contenedor: Flex
# Consumption es code-only; las imágenes Docker requieren Premium/Dedicated.
# Por eso este workflow no usa el ACR ni el Dockerfile que sí utiliza
# deploy_fastapi.yml (la vía App Service, hoy no usada).
#
# DOS CUENTAS DE AZURE, Y POR QUÉ PERFIL DE PUBLICACIÓN
# -----------------------------------------------------
# Las Function Apps del oráculo (dev y pro) viven en una suscripción DISTINTA
# de la del resto de la plataforma (ACR, App Service, storage), que es la que
# usa deploy_fastapi.yml. Por eso este workflow NO reutiliza el secret
# AZURE_CREDENTIALS: aquel service principal pertenece a la otra suscripción y
# no tiene permiso sobre estos recursos.
#
# Tampoco se crea uno propio: la suscripción del oráculo cuelga del tenant de
# la universidad, que bloquea el registro de aplicaciones a los usuarios
# normales ("Insufficient privileges to complete the operation"). Eso descarta
# tanto `az ad sp create-for-rbac` como OIDC, que necesitan ese mismo registro.
# La vía que queda usa permisos sobre el RECURSO, no sobre el directorio: el
# PERFIL DE PUBLICACIÓN.
#
# Requiere tener habilitada la autenticación básica de SCM, que se desactiva
# por defecto al crear la app:
#   az resource update --resource-group <rg> --namespace Microsoft.Web \
#     --resource-type basicPublishingCredentialsPolicies --name scm \
#     --parent sites/<app> --set properties.allow=true
# Y el perfil se descarga del portal ("Obtener perfil de publicación") o con
# `az functionapp deployment list-publishing-profiles --xml`. El XML COMPLETO
# va como secret del Environment. Es menos seguro que OIDC —son credenciales
# de larga duración— pero es lo disponible; si algún día se puede registrar
# una aplicación, migrar a OIDC es cambiar este paso por azure/login.
#
# Que las cuentas estén separadas NO afecta al runtime: la Function llega a
# ADLS con un SAS token, a Supabase con cadena de conexión y a Gemini/Foundry
# con API key. Ninguno depende de identidad de Azure, así que cruzan
# suscripciones sin configuración adicional.
#
# UN WORKFLOW, DOS ENTORNOS (GitHub Environments)
# -----------------------------------------------
# En vez de duplicar el fichero, cada entorno (dev/prod) aporta sus propios
# valores desde su GitHub Environment:
#   - secret  AZURE_FUNCTIONAPP_PUBLISH_PROFILE : XML del perfil de esa app
#   - var     FUNCTION_APP_NAME                 : nombre de la Function App
# Un push a main despliega dev; producción solo se despliega a mano
# (workflow_dispatch), y el Environment "prod" admite además reglas de
# protección —revisor obligatorio— si se quiere.
#
# Requisitos previos en Azure (no los crea este workflow):
#   - Function App Linux, runtime Python 3.11, plan Flex Consumption, UNA POR
#     ENTORNO, en la suscripción del oráculo.
#   - Autenticación básica de SCM habilitada (comando de arriba), por app.
#   - Application Settings con NAUTIQ_ENV, PG*, ADLS_SAS_TOKEN, GEMINI_*,
#     FOUNDRY_* (ver api/local.settings.json.example). SIN ellas la Function
#     arranca pero falla en la primera alerta. NAUTIQ_ENV es la crítica y hay
#     que ponerla DISTINTA en cada app (DEV / PRO): si falta, app/config.py
#     asume DEV y producción escribiría en las tablas y carpetas de
#     desarrollo sin quejarse. Comprobable con GET /api/health.
#   - PGHOST debe apuntar al POOLER de Supabase, no a la conexión directa: el
#     host directo (db.<ref>.supabase.co) solo tiene registro AAAA, y App
#     Service/Functions no tiene salida IPv6 — desde la Function sería
#     inalcanzable y toda alerta fallaría en fetch_cii_inicial.
#
# ---------------------------------------------------------------------------
# MEMORIA Y CONCURRENCIA (no se configuran aquí ni en host.json)
# ---------------------------------------------------------------------------
# En Flex Consumption se factura por GB-s = (memoria de instancia) x (tiempo
# de ejecución), con un free grant de 100.000 GB-s/mes. El coste por alerta es
# `memoria / concurrencia x tiempo`, así que la memoria SOLA no ahorra nada:
# lo que ahorra es repartirla entre ejecuciones simultáneas. Medido sobre
# alertas reales: ~138 MB de base fija, 2,5-5,2 s por alerta (dominado por la
# latencia de Open-Meteo y del LLM) y solo ~0,2 MB marginales por alerta
# adicional — un perfil I/O-bound, ideal para concurrencia alta.
#
#   2048 MB con concurrencia 8 -> ~1,3 GB-s/alerta   (~77.000 alertas gratis)
#   2048 MB con concurrencia 1 -> ~10,4 GB-s/alerta  (~9.600 alertas gratis)
#
# Es decir: dejar la concurrencia por defecto sin mirarla consume el grant
# hasta 8x más rápido. Ese ajuste NO vive en host.json (el
# `extensions.http.maxConcurrentRequests` se IGNORA en Flex Consumption, por
# eso se quitó de ahí: engañaba al que lo leyera). Es propiedad de la app:
#
#   az functionapp scale config set \
#     --name <FUNCTION_APP_NAME> --resource-group <RG> \
#     --instance-memory 2048
#
#   az functionapp scale config set \
#     --name <FUNCTION_APP_NAME> --resource-group <RG> \
#     --trigger-type http --trigger-settings perInstanceConcurrency=8
#
# Y un TECHO DE INSTANCIAS, que por defecto viene en 100:
#
#   az functionapp scale config set \
#     --name <FUNCTION_APP_NAME> --resource-group <RG> \
#     --maximum-instance-count 5
#
# El tope es un cortafuegos sobre los recursos de aguas abajo, no un ajuste de
# rendimiento:
#   - Conexiones: db_conn abre una conexión por invocación (sin pool), así que
#     el máximo simultáneo es instancias x concurrencia. Con el defecto de 100
#     salen hasta 800 conexiones contra Supabase; con 5, cuarenta.
#   - Coste: 100 instancias x 2 GB sostenidas una hora son 720.000 GB-s, y el
#     grant mensual son 100.000. Una tormenta de reintentos lo agotaría en
#     minutos, sin que nadie se entere hasta que llega la factura.
#
# Que 5 basta se comprueba contra tráfico REAL (9 días en producción, 7.290
# recomendaciones): 810 alertas/día de media, pico sostenido de 5,6/min y
# ráfaga máxima de 119 alertas en un minuto. A concurrencia 8 y ~5 s por
# alerta, una instancia sostiene ~92 alertas/min, así que el tope da del orden
# de 460/min: ~4x la peor ráfaga observada.
#
# Si algún día el tráfico supera esa capacidad, el síntoma es encolado y
# latencia —visible y ajustable subiendo el tope— en vez de agotar la base de
# datos o el grant en silencio. Conviene revisar el número si cambia el número
# de puertos monitorizados, que es lo que escala el volumen.
#
# Consultar lo que hay puesto:
#   az functionapp scale config show --name <FUNCTION_APP_NAME> --resource-group <RG>
#
# `functionTimeout: 00:05:00` en host.json es deliberado y no herencia: en
# Flex el techo por defecto son 30 min, y como se paga por tiempo, una alerta
# atascada quemaría GB-s del grant. 5 min deja ~60x el peor caso medido.
# ============================================================================

name: Deploy Oracle Function

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy_function.yml"
  workflow_dispatch:
    inputs:
      entorno:
        description: "Entorno de despliegue"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

env:
  # Raíz del paquete: contiene host.json, function_app.py, requirements.txt
  # y el paquete app/. Lo que no debe viajar está en api/.funcignore.
  PACKAGE_PATH: api
  PYTHON_VERSION: "3.11"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # `inputs.entorno` solo existe en la ejecución manual; un push a main no lo
    # define y cae a "dev". Producción NUNCA se despliega por push, hay que
    # pedirla explícitamente.
    environment: ${{ inputs.entorno || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Comprobación barata que evita el fallo más caro de este despliegue:
      # un error de importación no se ve hasta que el host intenta cargar
      # function_app.py YA en Azure, y allí se manifiesta como "No job
      # functions found" — un mensaje que no dice nada del error real.
      - name: Verificar que el Function App carga
        working-directory: ${{ env.PACKAGE_PATH }}
        run: |
          pip install -r requirements.txt
          python -c "import function_app; print('function_app importa correctamente')"

      # Falla pronto y con un mensaje claro si el Environment no está
      # configurado. Sin esto, un FUNCTION_APP_NAME vacío llega hasta el paso
      # de despliegue y allí el error habla de un nombre de app inexistente,
      # que no señala la causa real.
      - name: Comprobar configuración del entorno
        run: |
          if [ -z "${{ vars.FUNCTION_APP_NAME }}" ]; then
            echo "::error::Falta la variable FUNCTION_APP_NAME en el GitHub Environment '${{ inputs.entorno || 'dev' }}'."
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}" ]; then
            echo "::error::Falta el secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE en el GitHub Environment '${{ inputs.entorno || 'dev' }}'."
            exit 1
          fi
          echo "Entorno: ${{ inputs.entorno || 'dev' }} -> Function App: ${{ vars.FUNCTION_APP_NAME }}"

      # Marca el paquete con el commit desplegado. /api/health lo devuelve en
      # "build", y el paso de humo comprueba que coincide: así se confirma que
      # la app está sirviendo ESTE código, y no una versión anterior que
      # respondía igual porque el despliegue falló en silencio.
      - name: Sellar el build con el commit
        run: echo "${{ github.sha }}" > ${{ env.PACKAGE_PATH }}/BUILD_INFO

      # NO se usa Azure/functions-action. Con perfil de publicación construye
      # el hostname SCM clásico `<app>.scm.azurewebsites.net`, que en Flex
      # Consumption NO EXISTE —el real es regional y con hash, del tipo
      # `<app>-<hash>.scm.<region>-01.azurewebsites.net`— y falla con
      # "zipDeploy ... Not Found (CODE: 404)", un error que parece del paquete
      # y en realidad es de resolución de host. La ironía es que el hostname
      # correcto viene DENTRO del propio perfil, en publishUrl.
      #
      # Así que se despliega con un POST directo a OneDeploy, leyendo el host
      # y las credenciales del perfil. Verificado contra la app real: 202 y el
      # build nuevo sirviéndose ~80 s después.
      #
      # (La vía "oficial" para Flex es azure/login + ARM, pero eso exige un
      # service principal que el tenant de la universidad no deja crear.)
      # Las credenciales NO pasan por el shell: la primera versión hacía `eval`
      # de asignaciones generadas y devolvía 401, porque las contraseñas de los
      # perfiles de Azure llevan caracteres que bash expande o parte ($, +...).
      # Al hacerlo dentro de Python ese fallo no puede reproducirse.
      - name: Desplegar (OneDeploy contra el SCM regional)
        id: desplegar
        env:
          PERFIL: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          python "${{ env.PACKAGE_PATH }}/scripts/empaquetar.py" paquete.zip
          python "${{ env.PACKAGE_PATH }}/scripts/desplegar.py" paquete.zip

      # Prueba de humo: /api/health es anónimo y devuelve a qué entorno y tabla
      # apunta la instancia. Es la forma de cazar el fallo más silencioso de
      # este despliegue —NAUTIQ_ENV mal puesta en las Application Settings—,
      # que si no no se nota hasta ver filas en la tabla equivocada.
      # El host sale del paso de despliegue, que lo deriva del perfil. NO se
      # compone como "<app>.azurewebsites.net": en Flex Consumption ese nombre
      # no existe (el real lleva hash y región) y curl falla con "Could not
      # resolve host", que parece un problema de red y es de nomenclatura.
      - name: Prueba de humo (/api/health)
        run: |
          python "${{ env.PACKAGE_PATH }}/scripts/verificar_despliegue.py" \
            "${{ steps.desplegar.outputs.host_app }}" \
            "${{ github.sha }}" \
            "$([ "${{ inputs.entorno || 'dev' }}" = "prod" ] && echo PRO || echo DEV)"
