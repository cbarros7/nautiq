# ============================================================================
# Nautiq — Deploy del frontal a Azure Static Web Apps
# ============================================================================
# El frontal es estatico: no consume creditos (plan Free: 100 GB/mes, SSL y
# dominio propio incluidos) y la region es irrelevante porque no se despliega
# ningun computo gestionado con el.
#
# Independiente de deploy_fastapi.yml a proposito: el frontal no habla con el
# App Service del oraculo, solo lee la tabla oracle_recommendations. Su ciclo
# de despliegue no debe acoplarse al de la capa cognitiva.
# ============================================================================

name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "contracts/oracle_recommendation_v1.schema.json"
      - ".github/workflows/deploy_frontend.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "frontend/**"
      - "contracts/oracle_recommendation_v1.schema.json"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      # Los tipos se GENERAN desde contracts/. Si el esquema cambia y nadie
      # regenero types.ts, esto lo detecta aqui y no en produccion.
      - name: Los tipos generados estan al dia
        working-directory: frontend
        run: |
          npm run gen:types
          if ! git diff --quiet -- src/types.ts; then
            echo "::error file=frontend/src/types.ts::src/types.ts no coincide con el esquema. Ejecuta 'npm run gen:types' y commitea el resultado."
            git --no-pager diff -- src/types.ts
            exit 1
          fi

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # En produccion se lee la tabla, no el fixture.
          VITE_USE_MOCK: "false"
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true          # ya construido arriba, con las VITE_* inyectadas
          skip_api_build: true

  close-pr-environment:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
