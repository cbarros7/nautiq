[project]
name = "nautiq-api"
version = "0.1.0"
description = "Capa Cognitiva de Nautiq (FastAPI + LangGraph)"
requires-python = ">=3.11.9"
dependencies = [
    # Runtime de Azure Functions (modelo de programación v2, por decoradores).
    # El host de Functions es quien invoca function_app.py; este paquete solo
    # aporta los tipos/decoradores, no levanta ningún servidor.
    "azure-functions>=1.21",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "searoute>=1.6.0",
    "geopy>=2.5.0",
    "requests>=2.31",
    "langgraph>=0.2",
    "pydantic>=2.9",
    "psycopg[binary]>=3.3.4",
    "google-genai>=1.0",
    # Respaldo del resumen LLM cuando el free tier de Gemini agota cuota
    # (ver app/agents/tools/llm_provider.py). Endpoint de inferencia de
    # Azure AI Foundry: sirve todo el catálogo con una sola API key.
    "azure-ai-inference>=1.0.0b9",
    "python-ulid>=2.0",  # mismo linaje ULID que ingestion/src/ais/publisher.py
    # Cliente Supabase REST vía httpx (PostgREST). El SDK supabase-py completo
    # (con realtime) fija websockets<14 y choca con el cliente AIS (websockets>=16);
    # se evita usando httpx directo. Añadir supabase-py solo si se requiere realtime.
    #
    # Futuro (capa cognitiva, aún no implementada):
    # "fastapi", "uvicorn"
    "azure-storage-blob>=12.30.0",
]

[dependency-groups]
# Solo para desarrollo: NO viaja en el paquete desplegado (requirements.txt se
# genera con `uv export --no-dev`, y .funcignore excluye tests/ y scripts/).
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests importan `app.*` y `function_app`, que viven en la raíz de api/.
pythonpath = ["."]
