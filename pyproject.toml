[project]
name = "logistica-maritima"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "nautiq-ingestion",
    "python-dotenv>=1.2.2",
    "websockets>=16.0",
]

[tool.uv.workspace]
members = [
    "ingestion",
    "api",
    "databricks",
]

[tool.uv.sources]
nautiq-ingestion = { workspace = true }

[tool.pytest.ini_options]
# Raíz del repo en sys.path para que `import ingestion.src...` funcione bajo uv run.
pythonpath = ["."]
testpaths = ["ingestion/tests"]
